<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>ミントサーバー 稼働状況</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <h1>ミントサーバー</h1>
          <p>稼働状況</p>
        </div>
      </div>
      <div id="updated" class="updated">確認中</div>
    </header>

    <main>
      <section class="section">
        <div class="section-head">
          <h2>過去3日間の稼働履歴</h2>
          <span>3日前 → 現在</span>
        </div>
        <div class="history-card">
          <div id="historyRows" class="history-rows"></div>
          <div class="axis">
            <span>3日前</span>
            <span>2日前</span>
            <span>1日前</span>
            <span>現在</span>
          </div>
          <div class="legend">
            <span><i class="legend-bar ok"></i>正常</span>
            <span><i class="legend-bar bad"></i>障害</span>
            <span><i class="legend-bar unknown"></i>未記録</span>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>お知らせ</h2>
        </div>
        <div id="notices" class="notice-list"></div>
      </section>

      <section class="section two-col">
        <div>
          <div class="section-head"><h2>障害</h2></div>
          <div id="incidents" class="status-list"></div>
        </div>
        <div>
          <div class="section-head"><h2>正常</h2></div>
          <div id="healthy" class="status-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
